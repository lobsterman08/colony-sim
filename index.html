<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Colony Forge</title>
    <style>
      :root {
        --bg-0: #0b1116;
        --bg-1: #131d26;
        --panel: rgba(15, 22, 28, 0.9);
        --panel-soft: rgba(19, 31, 38, 0.8);
        --border: rgba(165, 196, 220, 0.23);
        --text: #edf7ff;
        --muted: #9bb3c2;
        --accent: #6ce0a2;
        --accent-2: #4cd0a8;
        --gold: #f4d78a;
        --danger: #ff8d8d;
        --shadow: rgba(0,0,0,0.42);
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg-0);
        color: var(--text);
        font-family: "Segoe UI", sans-serif;
        overflow: hidden;
      }

      body { display: flex; }

      button {
        font: inherit;
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
        background: linear-gradient(180deg, var(--bg-1), var(--bg-0));
      }

      .topbar {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 12px;
        align-items: center;
        padding: 10px 14px;
        background: rgba(8,14,18,0.94);
        border-bottom: 1px solid var(--border);
      }

      .brand-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand {
        font-weight: 800;
        letter-spacing: 0.06em;
        font-size: 1.15rem;
      }

      .time-label {
        font-size: 0.82rem;
        color: var(--muted);
      }

      .resource-bar {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }

      .resource-pill {
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255,255,255,0.025);
        color: var(--text);
        padding: 6px 10px;
        font-size: 0.78rem;
        white-space: nowrap;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn, .mini-btn, .speed-btn, .task-btn, .priority-btn {
        appearance: none;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 10px;
        color: var(--text);
        padding: 8px 10px;
        cursor: pointer;
        transition: 0.12s ease;
      }

      .btn:active, .mini-btn:active, .speed-btn:active, .task-btn:active, .priority-btn:active {
        transform: scale(0.98);
      }

      .btn.accent {
        background: linear-gradient(180deg, var(--accent), var(--accent-2));
        color: #072b1e;
        font-weight: 700;
      }

      .speed-btn.active {
        background: rgba(108, 224, 162, 0.1);
        border-color: rgba(108,224,162,0.7);
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(200px, 260px) minmax(0, 1fr) minmax(220px, 260px);
        flex: 1;
        min-height: 0;
      }

      .panel {
        background: var(--panel);
        border-right: 1px solid var(--border);
        padding: 12px;
        overflow: auto;
      }

      .panel.right {
        border-right: none;
        border-left: 1px solid var(--border);
      }

      .panel h3 {
        margin: 0 0 8px 0;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.72rem;
        color: var(--muted);
      }

      .box {
        background: rgba(255,255,255,0.025);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px;
        margin-bottom: 12px;
      }

      .mini-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .colonist-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 6px;
        border-radius: 10px;
        background: rgba(255,255,255,0.02);
        border: 1px solid transparent;
        cursor: pointer;
      }

      .colonist-item.selected {
        border-color: rgba(108,224,162,0.65);
        background: rgba(108,224,162,0.08);
      }

      .avatar {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #87a2b4, #4d6071);
        font-weight: 700;
        font-size: 0.72rem;
      }

      .status-line {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin: 8px 0;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .status-line strong {
        color: var(--text);
      }

      .task-grid, .priority-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .task-btn, .priority-btn {
        width: 100%;
        font-size: 0.75rem;
        padding: 7px 8px;
      }

      .priority-btn.active {
        border-color: rgba(108,224,162,0.8);
        background: rgba(108,224,162,0.08);
      }

      .viewport-shell {
        position: relative;
        overflow: hidden;
        background: #0a1721;
        min-height: 0;
      }

      #gameCanvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #0a1721;
        touch-action: none;
        user-select: none;
      }

      .build-panel {
        position: absolute;
        left: 12px;
        top: 12px;
        width: min(310px, calc(100% - 24px));
        max-height: 72%;
        background: rgba(8,14,18,0.95);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 14px 30px rgba(0,0,0,0.35);
        overflow: hidden;
        transition: transform 0.22s ease, opacity 0.22s ease;
      }

      .build-panel.closed {
        transform: translateX(-108%);
        opacity: 0;
        pointer-events: none;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        font-weight: 700;
      }

      .build-categories {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 10px;
        overflow: auto;
      }

      .build-category {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(255,255,255,0.02);
        overflow: hidden;
      }

      .build-category-title {
        background: rgba(255,255,255,0.03);
        padding: 8px 10px;
        font-weight: 700;
      }

      .build-items {
        display: grid;
        grid-template-columns: repeat(2, minmax(0,1fr));
        gap: 8px;
        padding: 10px;
      }

      .build-item {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(255,255,255,0.03);
        color: var(--text);
        padding: 8px;
        cursor: pointer;
        text-align: left;
      }

      .build-item.active {
        border-color: rgba(108,224,162,0.8);
        background: rgba(108,224,162,0.08);
      }

      .toast {
        position: absolute;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%) translateY(20px);
        opacity: 0;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(10,17,22,0.96);
        border: 1px solid var(--border);
        transition: transform 0.18s ease, opacity 0.18s ease;
        pointer-events: none;
      }

      .toast.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .bottom-toolbar {
        display: flex;
        justify-content: center;
        gap: 10px;
        border-top: 1px solid var(--border);
        background: rgba(8,14,18,0.9);
        padding: 10px 12px 14px;
      }

      .alert-item {
        margin: 8px 0;
        padding-left: 8px;
        border-left: 3px solid var(--gold);
        font-size: 0.8rem;
      }

      .log-entry {
        margin: 4px 0;
        font-size: 0.78rem;
        color: var(--muted);
      }

      @media (max-width: 920px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .panel.left, .panel.right {
          display: none;
        }
        .topbar {
          grid-template-columns: 1fr;
          justify-items: center;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand">COLONY FORGE</div>
          <div id="timeLabel" class="time-label">Day 1</div>
        </div>

        <div id="resourceBar" class="resource-bar"></div>

        <div class="controls">
          <button id="pauseBtn" class="btn">Pause</button>
          <button class="speed-btn active" data-speed="1">1x</button>
          <button class="speed-btn" data-speed="2">2x</button>
          <button class="speed-btn" data-speed="4">4x</button>
        </div>
      </header>

      <main class="layout">
        <aside class="panel left">
          <h3>Colony</h3>
          <div id="colonySummary" class="box"></div>
          <div id="colonistList" class="mini-list"></div>
        </aside>

        <section class="viewport-shell">
          <canvas id="gameCanvas"></canvas>

          <div id="buildPanel" class="build-panel">
            <div class="panel-header">
              <span>Build</span>
              <button id="hideBuildBtn" class="mini-btn">Hide</button>
            </div>
            <div id="buildCategories" class="build-categories"></div>
          </div>

          <div id="toast" class="toast"></div>
        </section>

        <aside class="panel right">
          <h3>Selected</h3>
          <div id="selectedUnit" class="box"></div>

          <h3>Alerts</h3>
          <div id="alerts" class="box"></div>

          <h3>Event Log</h3>
          <div id="eventLog" class="box"></div>
        </aside>
      </main>

      <footer class="bottom-toolbar">
        <button id="buildToggleBtn" class="btn accent">Build</button>
        <button id="saveBtn" class="btn">Save</button>
        <button id="loadBtn" class="btn">Load</button>
        <button id="newWorldBtn" class="btn">New World</button>
      </footer>
    </div>

    <script>
      (() => {
        const TILE_SIZE = 32;
        const WORLD_SIZE = 90;
        const SAVE_KEY = 'colony_forge_save_v2';

        const TASKS = {
          gatherWood: 'Gather Wood',
          gatherStone: 'Gather Stone',
          farm: 'Farm',
          rest: 'Rest',
          eat: 'Eat',
          clear: 'Clear',
          build: 'Build'
        };

        const PRIORITY_RANK = {
          low: 1,
          normal: 2,
          high: 3,
          urgent: 4
        };

        const PRIORITY_NAMES = ['Low', 'Normal', 'High', 'Urgent'];

        const BUILDINGS = {
          wall: { label: 'Wall', color: '#c7d0d9', cost: { stone: 2 }, buildTime: 2 },
          floor: { label: 'Floor', color: '#8c9aa8', cost: { wood: 1 }, buildTime: 1 },
          bed: { label: 'Bed', color: '#d8af73', cost: { wood: 2, stone: 1 }, buildTime: 3 },
          storage: { label: 'Storage', color: '#d6b98d', cost: { wood: 3, stone: 1 }, buildTime: 3 },
          campfire: { label: 'Campfire', color: '#f39d54', cost: { wood: 2, stone: 1 }, buildTime: 4 },
          farm: { label: 'Crop Plot', color: '#7aca6d', cost: { wood: 2 }, buildTime: 3 }
        };

        const BUILD_CATEGORIES = {
          Structures: ['wall', 'floor'],
          Furniture: ['bed', 'storage'],
          Utilities: ['campfire'],
          Farming: ['farm']
        };

        const TERRAIN = {
          grass: '#569b59',
          dirt: '#8d6e47',
          stone: '#7d7f86',
          water: '#2d6f8d',
          sand: '#d8b76f'
        };

        const DEFAULT_RESOURCES = { wood: 24, stone: 18, food: 20, cloth: 2, metal: 0 };

        const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
        const randBetween = (min, max) => min + Math.random() * (max - min);

        function createWorld(seed) {
          const tiles = new Map();
          const resourceNodes = [];
          const structures = [];
          const cropPlots = [];

          for (let y = 0; y < WORLD_SIZE; y++) {
            for (let x = 0; x < WORLD_SIZE; x++) {
              const nx = x / WORLD_SIZE;
              const ny = y / WORLD_SIZE;
              const noise = Math.sin((nx + seed) * 18) + Math.cos((ny - seed) * 14) + Math.sin((x + y) * 0.12 + seed);
              let tile = 'grass';
              if (noise > 1.9) tile = 'water';
              else if (noise < -1.5) tile = 'stone';
              else if (x > WORLD_SIZE * 0.7 || y > WORLD_SIZE * 0.74) tile = 'sand';
              tiles.set(`${x},${y}`, tile);
            }
          }

          for (let i = 0; i < WORLD_SIZE * 5; i++) {
            const x = Math.floor(Math.random() * WORLD_SIZE);
            const y = Math.floor(Math.random() * WORLD_SIZE);
            if (tiles.get(`${x},${y}`) !== 'water') {
              resourceNodes.push({ type: 'tree', x, y, hp: 5 });
            }
          }

          for (let i = 0; i < WORLD_SIZE * 2.5; i++) {
            const x = Math.floor(Math.random() * WORLD_SIZE);
            const y = Math.floor(Math.random() * WORLD_SIZE);
            if (tiles.get(`${x},${y}`) !== 'water') {
              resourceNodes.push({ type: 'rock', x, y, hp: 6 });
            }
          }

          return { tiles, resourceNodes, structures, cropPlots };
        }

        function createColonist(index) {
          const names = ['Ari', 'Mira', 'Rowan', 'Juno', 'Tess', 'Ivo', 'Nia', 'Cai'];
          return {
            id: `c-${Date.now()}-${index}`,
            name: names[index % names.length],
            x: 18 + index * 0.7,
            y: 18 + index * 0.5,
            hunger: 72,
            sleep: 78,
            fun: 70,
            mood: 78,
            health: 100,
            priority: 'normal',
            job: 'wander',
            task: null,
            target: null,
            tint: ['#dfeaf8', '#d4b8a7', '#d2dff7', '#e6d7b0'][index % 4],
            skills: {
              construction: 1 + Math.random() * 2,
              mining: 1 + Math.random() * 2,
              farming: 1 + Math.random() * 2,
              crafting: 1 + Math.random() * 2
            }
          };
        }

        function Game() {
          this.world = createWorld(Math.random() * 1000);
          this.colonists = [];
          this.resources = { ...DEFAULT_RESOURCES };
          this.selectedColonistId = null;
          this.camera = { x: 0, y: 0, zoom: 1 };
          this.speed = 1;
          this.paused = false;
          this.day = 1;
          this.time = 0;
          this.buildMode = null;
          this.buildOpen = true;
          this.previewTile = null;
          this.dragging = null;
          this.lastFrame = 0;
          this.log = ['World generated.'];
          this.alerts = ['The colony is calm.'];

          this.canvas = document.getElementById('gameCanvas');
          this.ctx = this.canvas.getContext('2d');
          this.resourceBar = document.getElementById('resourceBar');
          this.colonistList = document.getElementById('colonistList');
          this.colonySummary = document.getElementById('colonySummary');
          this.selectedUnit = document.getElementById('selectedUnit');
          this.alertsBox = document.getElementById('alerts');
          this.eventLog = document.getElementById('eventLog');
          this.timeLabel = document.getElementById('timeLabel');
          this.buildPanel = document.getElementById('buildPanel');
          this.buildCategories = document.getElementById('buildCategories');
          this.toast = document.getElementById('toast');
          this.pauseBtn = document.getElementById('pauseBtn');
          this.buildToggleBtn = document.getElementById('buildToggleBtn');

          this.setupUI();
          this.spawnColonists();
          this.populateBuildMenu();
          this.resizeCanvas();
          this.camera.x = 17 * TILE_SIZE;
          this.camera.y = 17 * TILE_SIZE;
          this.renderUI();
          requestAnimationFrame(this.loop.bind(this));
        }

        Game.prototype.setupUI = function () {
          const that = this;

          this.pauseBtn.addEventListener('click', () => {
            this.paused = !this.paused;
            this.pauseBtn.textContent = this.paused ? 'Resume' : 'Pause';
          });

          document.querySelectorAll('.speed-btn').forEach((button) => {
            button.addEventListener('click', function () {
              that.speed = Number(this.dataset.speed);
              document.querySelectorAll('.speed-btn').forEach((btn) => {
                btn.classList.toggle('active', btn === button);
              });
            });
          });

          document.getElementById('buildToggleBtn').addEventListener('click', () => {
            if (this.buildMode) {
              this.exitBuildMode();
              this.showToast('Build mode off');
            } else {
              this.buildMode = 'wall';
              this.buildOpen = true;
              this.buildPanel.classList.remove('closed');
              this.refreshBuildButtons();
              this.showToast('Build mode: Wall');
            }
          });

          document.getElementById('hideBuildBtn').addEventListener('click', () => {
            this.exitBuildMode();
            this.buildOpen = false;
            this.buildPanel.classList.add('closed');
          });

          document.getElementById('saveBtn').addEventListener('click', () => this.saveGame());
          document.getElementById('loadBtn').addEventListener('click', () => this.loadGame());
          document.getElementById('newWorldBtn').addEventListener('click', () => this.newWorld());

          this.buildCategories.addEventListener('click', (event) => {
            const item = event.target.closest('.build-item');
            if (!item) return;
            const type = item.dataset.type;
            if (this.buildMode === type) {
              this.exitBuildMode();
              this.showToast('Build mode off');
              return;
            }
            this.buildMode = type;
            this.buildOpen = true;
            this.buildPanel.classList.remove('closed');
            this.refreshBuildButtons();
            this.showToast(`Build mode: ${BUILDINGS[type].label}`);
          });

          window.addEventListener('resize', () => this.resizeCanvas());

          this.canvas.addEventListener('pointerdown', (event) => this.handlePointerDown(event));
          this.canvas.addEventListener('pointermove', (event) => this.handlePointerMove(event));
          this.canvas.addEventListener('pointerup', () => { this.dragging = null; });
          this.canvas.addEventListener('pointerleave', () => { this.dragging = null; });
          this.canvas.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            if (this.buildMode) {
              this.exitBuildMode();
              this.showToast('Build mode canceled');
            }
          });

          this.canvas.addEventListener('wheel', (event) => {
            event.preventDefault();
            const delta = event.deltaY * -0.0015;
            this.camera.zoom = clamp(this.camera.zoom + delta, 0.8, 2.4);
          }, { passive: false });

          window.addEventListener('keydown', (event) => {
            if (event.key === ' ') {
              event.preventDefault();
              this.paused = !this.paused;
              this.pauseBtn.textContent = this.paused ? 'Resume' : 'Pause';
            }
            if (event.key.toLowerCase() === 'b') {
              this.buildOpen = !this.buildOpen;
              this.buildPanel.classList.toggle('closed', !this.buildOpen);
            }
            if (event.key === 'Escape') {
              this.exitBuildMode();
              this.showToast('Build mode off');
            }
            if (event.key.toLowerCase() === 's') {
              this.saveGame();
            }
          });
        };

        Game.prototype.exitBuildMode = function () {
          this.buildMode = null;
          this.previewTile = null;
          this.refreshBuildButtons();
          this.buildToggleBtn.textContent = 'Build';
        };

        Game.prototype.refreshBuildButtons = function () {
          document.querySelectorAll('.build-item').forEach((button) => {
            button.classList.toggle('active', this.buildMode === button.dataset.type);
          });
        };

        Game.prototype.populateBuildMenu = function () {
          this.buildCategories.innerHTML = '';
          for (const [categoryName, itemList] of Object.entries(BUILD_CATEGORIES)) {
            const wrapper = document.createElement('div');
            wrapper.className = 'build-category';
            wrapper.innerHTML = '<div class="build-category-title">' + categoryName + '</div>' +
              '<div class="build-items">' + itemList.map((type) => '<button class="build-item" data-type="' + type + '">' + BUILDINGS[type].label + '</button>').join('') + '</div>';
            this.buildCategories.appendChild(wrapper);
          }
        };

        Game.prototype.showToast = function (message) {
          this.toast.textContent = message;
          this.toast.classList.add('visible');
          clearTimeout(this.toastTimer);
          this.toastTimer = setTimeout(() => this.toast.classList.remove('visible'), 1100);
        };

        Game.prototype.spawnColonists = function () {
          this.colonists = [];
          for (let i = 0; i < 6; i++) {
            this.colonists.push(createColonist(i));
          }
          this.selectedColonistId = this.colonists[0].id;

          this.world.structures.push({ type: 'bed', x: 16, y: 16, built: true, progress: 1 });
          this.world.structures.push({ type: 'storage', x: 17, y: 16, built: true, progress: 1 });
          this.world.structures.push({ type: 'campfire', x: 19, y: 18, built: true, progress: 1 });
        };

        Game.prototype.resizeCanvas = function () {
          const rect = this.canvas.parentElement.getBoundingClientRect();
          const ratio = window.devicePixelRatio || 1;
          this.canvas.width = Math.round(rect.width * ratio);
          this.canvas.height = Math.round(rect.height * ratio);
          this.ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        };

        Game.prototype.getCanvasCoords = function (event) {
          const rect = this.canvas.getBoundingClientRect();
          return {
            x: event.clientX - rect.left,
            y: event.clientY - rect.top
          };
        };

        Game.prototype.handlePointerDown = function (event) {
          const pos = this.getCanvasCoords(event);
          const tileX = Math.floor((pos.x + this.camera.x * this.camera.zoom) / (TILE_SIZE * this.camera.zoom));
          const tileY = Math.floor((pos.y + this.camera.y * this.camera.zoom) / (TILE_SIZE * this.camera.zoom));
          this.previewTile = { x: tileX, y: tileY };
          this.dragging = { startX: pos.x, startY: pos.y, lastX: pos.x, lastY: pos.y };
          this.canvas.setPointerCapture(event.pointerId);

          if (this.buildMode) {
            this.tryPlaceBuilding(tileX, tileY);
            return;
          }

          const clicked = this.colonists.find((colonist) => {
            return Math.abs(colonist.x - tileX) < 0.5 && Math.abs(colonist.y - tileY) < 0.5;
          });

          this.selectedColonistId = clicked ? clicked.id : null;
          this.renderUI();
        };

        Game.prototype.handlePointerMove = function (event) {
          if (!this.dragging) return;
          const pos = this.getCanvasCoords(event);
          const dx = pos.x - this.dragging.lastX;
          const dy = pos.y - this.dragging.lastY;
          this.camera.x -= dx / this.camera.zoom;
          this.camera.y -= dy / this.camera.zoom;
          this.dragging.lastX = pos.x;
          this.dragging.lastY = pos.y;
        };

        Game.prototype.tryPlaceBuilding = function (tx, ty) {
          if (!this.buildMode) return;
          const buildingDef = BUILDINGS[this.buildMode];
          const valid = this.isValidBuildTile(tx, ty);
          if (!valid) {
            this.showToast('Invalid placement');
            return;
          }

          const canAfford = Object.entries(buildingDef.cost || {}).every(([key, cost]) => this.resources[key] >= cost);
          if (!canAfford) {
            this.showToast('Not enough resources');
            return;
          }

          Object.entries(buildingDef.cost || {}).forEach(([key, cost]) => {
            this.resources[key] -= cost;
          });

          this.world.structures.push({ type: this.buildMode, x: tx, y: ty, built: false, progress: 0 });
          this.log.unshift(`Built ${buildingDef.label} at ${tx}, ${ty}.`);
          this.showToast(`${buildingDef.label} placed`);
          this.renderUI();
        };

        Game.prototype.isValidBuildTile = function (x, y) {
          if (x < 0 || y < 0 || x >= WORLD_SIZE || y >= WORLD_SIZE) return false;
          if (this.world.tiles.get(`${x},${y}`) === 'water') return false;
          return !this.world.structures.some((structure) => structure.x === x && structure.y === y);
        };

        Game.prototype.loop = function (ts) {
          const delta = Math.min(0.03, (ts - (this.lastFrame || ts)) / 1000 || 0.016);
          this.lastFrame = ts;
          if (!this.paused) {
            this.update(delta * this.speed);
          }
          this.render();
          requestAnimationFrame(this.loop.bind(this));
        };

        Game.prototype.update = function (dt) {
          this.time += dt;
          this.day = Math.max(1, Math.floor(this.time / 20) + 1);

          this.updateWorld(dt);
          this.updateColonists(dt);
          this.renderUI();

          if (Math.floor(this.time) % 12 === 0) {
            this.saveGame(false);
          }
        };

        Game.prototype.updateWorld = function (dt) {
          for (const plot of this.world.cropPlots) {
            plot.growth += dt * 0.04;
            if (plot.growth >= 1) {
              plot.mature = true;
            }
          }

          for (const structure of this.world.structures) {
            if (!structure.built) {
              structure.progress += dt * (1 / (BUILDINGS[structure.type].buildTime || 2));
              if (structure.progress >= 1) {
                structure.built = true;
                structure.progress = 1;
              }
            }
          }
        };

        function nearestNode(world, x, y, type) {
          let best = null;
          let bestDist = Infinity;
          for (const node of world.resourceNodes) {
            if (node.type !== type) continue;
            const d = Math.hypot(node.x - x, node.y - y);
            if (d < bestDist) {
              bestDist = d;
              best = node;
            }
          }
          return best;
        }

        function moveTowardTarget(colonist, tx, ty, speed) {
          const dx = tx - colonist.x;
          const dy = ty - colonist.y;
          const dist = Math.hypot(dx, dy) || 1;
          const moveX = (dx / dist) * speed;
          const moveY = (dy / dist) * speed;
          colonist.x = clamp(colonist.x + moveX, 0, WORLD_SIZE - 1);
          colonist.y = clamp(colonist.y + moveY, 0, WORLD_SIZE - 1);
        }

        function gatherNearestResource(game, colonist, type, resourceType) {
          const node = nearestNode(game.world, colonist.x, colonist.y, type);
          if (!node) return;
          const dist = Math.hypot(node.x - colonist.x, node.y - colonist.y);
          if (dist < 1.1) {
            const index = game.world.resourceNodes.indexOf(node);
            if (index >= 0) {
              node.hp -= 1;
              if (node.hp <= 0) {
                game.world.resourceNodes.splice(index, 1);
              }
              game.resources[resourceType] += 1 + (type === 'tree' ? 1 : 0);
              colonist.fun = clamp(colonist.fun + 6, 0, 100);
            }
            return;
          }
          moveTowardTarget(colonist, node.x, node.y, 0.12);
        }

        function maybeCreateFarmPlot(game, colonist) {
          if (game.world.cropPlots.length >= 8) return null;
          const tx = Math.floor(colonist.x + randBetween(-3, 3));
          const ty = Math.floor(colonist.y + randBetween(-3, 3));
          if (tx < 0 || ty < 0 || tx >= WORLD_SIZE || ty >= WORLD_SIZE) return null;
          if (game.world.tiles.get(`${tx},${ty}`) === 'water') return null;
          const plot = { x: tx, y: ty, crop: 'wheat', growth: 0.08, mature: false };
          game.world.cropPlots.push(plot);
          return plot;
        }

        Game.prototype.harvestCrop = function (x, y) {
          const plot = this.world.cropPlots.find((p) => p.x === x && p.y === y);
          if (!plot || !plot.mature) return 0;
          plot.growth = 0.06;
          plot.mature = false;
          return 3;
        };

        Game.prototype.applyPriority = function (colonist, task) {
          const priority = colonist.priority || 'normal';
          if (task === 'rest') return PRIORITY_RANK[priority] <= 2 ? 0.8 : 1;
          return 1;
        };

        Game.prototype.setPriorityForSelected = function (priority) {
          const colonist = this.getSelectedColonist();
          if (!colonist) return;
          colonist.priority = priority;
          this.log.unshift(`${colonist.name} priority set to ${priority}.`);
          this.renderUI();
        };

        Game.prototype.assignTask = function (task, priorityOverride) {
          const colonist = this.getSelectedColonist();
          if (!colonist) return;
          colonist.task = task;
          colonist.priority = priorityOverride || colonist.priority || 'normal';
          colonist.job = TASKS[task] || task;
          this.log.unshift(`${colonist.name} assigned to ${TASKS[task] || task}.`);
          this.renderUI();
        };

        Game.prototype.getSelectedColonist = function () {
          if (!this.selectedColonistId) return null;
          return this.colonists.find((colonist) => colonist.id === this.selectedColonistId) || null;
        };

        Game.prototype.updateColonists = function (dt) {
          for (const colonist of this.colonists) {
            colonist.hunger = clamp(colonist.hunger - dt * 0.7, 0, 100);
            colonist.sleep = clamp(colonist.sleep - dt * 0.42, 0, 100);
            colonist.fun = clamp(colonist.fun - dt * 0.25, 0, 100);
            colonist.mood = clamp((colonist.hunger + colonist.sleep + colonist.fun) / 3, 0, 100);

            if (colonist.task === 'rest') {
              colonist.job = 'Rest';
              colonist.sleep = clamp(colonist.sleep + dt * 18, 0, 100);
              if (colonist.sleep > 70) {
                colonist.task = null;
                colonist.job = 'wander';
              }
              continue;
            }

            if (colonist.task === 'eat') {
              colonist.job = 'Eat';
              if (this.resources.food > 0) {
                this.resources.food -= 1;
                colonist.hunger = clamp(colonist.hunger + 45, 0, 100);
                colonist.task = null;
                colonist.job = 'wander';
              }
              continue;
            }

            if (colonist.task === 'gatherWood') {
              colonist.job = 'Gather Wood';
              gatherNearestResource(this, colonist, 'tree', 'wood');
              if (this.resources.wood > 30) {
                colonist.task = null;
                colonist.job = 'wander';
              }
              continue;
            }

            if (colonist.task === 'gatherStone') {
              colonist.job = 'Gather Stone';
              gatherNearestResource(this, colonist, 'rock', 'stone');
              if (this.resources.stone > 24) {
                colonist.task = null;
                colonist.job = 'wander';
              }
              continue;
            }

            if (colonist.task === 'farm') {
              colonist.job = 'Farm';
              const matureCrop = this.world.cropPlots.find((plot) => plot.mature);
              if (matureCrop) {
                this.resources.food += this.harvestCrop(matureCrop.x, matureCrop.y);
                colonist.task = null;
                colonist.job = 'wander';
                continue;
              }
              const plot = maybeCreateFarmPlot(this, colonist);
              if (plot) {
                moveTowardTarget(colonist, plot.x, plot.y, 0.12);
                continue;
              }
            }

            if (colonist.hunger < 35 && this.resources.food > 0) {
              this.resources.food -= 1;
              colonist.hunger = clamp(colonist.hunger + 40, 0, 100);
              colonist.job = 'Eat';
              continue;
            }

            if (colonist.sleep < 25) {
              colonist.job = 'Rest';
              colonist.sleep = clamp(colonist.sleep + dt * 16, 0, 100);
              continue;
            }

            if (this.resources.wood < 22 && nearestNode(this.world, colonist.x, colonist.y, 'tree')) {
              gatherNearestResource(this, colonist, 'tree', 'wood');
              colonist.job = 'Gather Wood';
              continue;
            }

            if (this.resources.stone < 18 && nearestNode(this.world, colonist.x, colonist.y, 'rock')) {
              gatherNearestResource(this, colonist, 'rock', 'stone');
              colonist.job = 'Gather Stone';
              continue;
            }

            if (this.resources.food < 30) {
              const crop = this.world.cropPlots.find((plot) => plot.mature);
              if (crop) {
                this.resources.food += this.harvestCrop(crop.x, crop.y);
              } else {
                const plot = maybeCreateFarmPlot(this, colonist);
                if (plot) {
                  colonist.job = 'Farm';
                  moveTowardTarget(colonist, plot.x, plot.y, 0.12);
                  continue;
                }
              }
            }

            if (Math.random() < 0.012) {
              const tx = randBetween(18, 22);
              const ty = randBetween(16, 22);
              wanderTowards(colonist, tx, ty);
            }
            colonist.job = 'wander';
          }
        };

        function wanderTowards(colonist, tx, ty) {
          moveTowardTarget(colonist, tx, ty, 0.08);
        }

        Game.prototype.render = function () {
          const width = this.canvas.clientWidth;
          const height = this.canvas.clientHeight;
          this.ctx.clearRect(0, 0, width, height);

          const startX = Math.max(0, Math.floor(this.camera.x / (TILE_SIZE * this.camera.zoom)) - 1);
          const endX = Math.min(WORLD_SIZE, Math.ceil((this.camera.x + width / this.camera.zoom) / (TILE_SIZE * this.camera.zoom)) + 1);
          const startY = Math.max(0, Math.floor(this.camera.y / (TILE_SIZE * this.camera.zoom)) - 1);
          const endY = Math.min(WORLD_SIZE, Math.ceil((this.camera.y + height / this.camera.zoom) / (TILE_SIZE * this.camera.zoom)) + 1);

          for (let y = startY; y < endY; y++) {
            for (let x = startX; x < endX; x++) {
              const pixelX = x * TILE_SIZE * this.camera.zoom - this.camera.x * this.camera.zoom;
              const pixelY = y * TILE_SIZE * this.camera.zoom - this.camera.y * this.camera.zoom;
              const tile = this.world.tiles.get(`${x},${y}`) || 'grass';
              this.ctx.fillStyle = TERRAIN[tile] || '#5c925f';
              this.ctx.fillRect(pixelX, pixelY, TILE_SIZE * this.camera.zoom, TILE_SIZE * this.camera.zoom);
              this.ctx.strokeStyle = 'rgba(0,0,0,0.08)';
              this.ctx.strokeRect(pixelX + 0.5, pixelY + 0.5, TILE_SIZE * this.camera.zoom - 1, TILE_SIZE * this.camera.zoom - 1);
            }
          }

          this.drawResourceNodes(startX, endX, startY, endY);
          this.drawStructures(startX, endX, startY, endY);
          this.drawCropPlots(startX, endX, startY, endY);
          this.drawColonists(startX, endX, startY, endY);

          if (this.previewTile && this.buildMode) {
            const px = this.previewTile.x * TILE_SIZE * this.camera.zoom - this.camera.x * this.camera.zoom;
            const py = this.previewTile.y * TILE_SIZE * this.camera.zoom - this.camera.y * this.camera.zoom;
            const valid = this.isValidBuildTile(this.previewTile.x, this.previewTile.y);
            this.ctx.strokeStyle = valid ? '#70e0b0' : '#ff8d8d';
            this.ctx.lineWidth = 2;
            this.ctx.strokeRect(px, py, TILE_SIZE * this.camera.zoom, TILE_SIZE * this.camera.zoom);
          }
        };

        Game.prototype.drawResourceNodes = function (startX, endX, startY, endY) {
          for (const node of this.world.resourceNodes) {
            if (node.x < startX || node.x >= endX || node.y < startY || node.y >= endY) continue;
            const x = node.x * TILE_SIZE * this.camera.zoom - this.camera.x * this.camera.zoom;
            const y = node.y * TILE_SIZE * this.camera.zoom - this.camera.y * this.camera.zoom;
            const cx = x + TILE_SIZE * this.camera.zoom * 0.5;
            const cy = y + TILE_SIZE * this.camera.zoom * 0.5;
            const r = TILE_SIZE * this.camera.zoom * 0.32;
            this.ctx.fillStyle = node.type === 'tree' ? '#417b36' : '#909aa7';
            this.ctx.shadowColor = 'rgba(0,0,0,0.25)';
            this.ctx.shadowBlur = 8;
            this.ctx.beginPath();
            this.ctx.arc(cx, cy, r, 0, 2 * Math.PI);
            this.ctx.fill();
            this.ctx.shadowBlur = 0;
          }
        };

        Game.prototype.drawStructures = function (startX, endX, startY, endY) {
          for (const structure of this.world.structures) {
            if (structure.x < startX || structure.x >= endX || structure.y < startY || structure.y >= endY) continue;
            const x = structure.x * TILE_SIZE * this.camera.zoom - this.camera.x * this.camera.zoom;
            const y = structure.y * TILE_SIZE * this.camera.zoom - this.camera.y * this.camera.zoom;
            const w = TILE_SIZE * this.camera.zoom;
            this.ctx.fillStyle = BUILDINGS[structure.type].color;
            this.ctx.fillRect(x + 2, y + 2, w - 4, w - 4);
            this.ctx.strokeStyle = 'rgba(0,0,0,0.18)';
            this.ctx.strokeRect(x + 2, y + 2, w - 4, w - 4);
            if (!structure.built) {
              this.ctx.fillStyle = 'rgba(0,0,0,0.4)';
              this.ctx.fillRect(x + 4, y + 4, (w - 8) * structure.progress, 4);
            }
          }
        };

        Game.prototype.drawCropPlots = function (startX, endX, startY, endY) {
          for (const plot of this.world.cropPlots) {
            if (plot.x < startX || plot.x >= endX || plot.y < startY || plot.y >= endY) continue;
            const x = plot.x * TILE_SIZE * this.camera.zoom - this.camera.x * this.camera.zoom;
            const y = plot.y * TILE_SIZE * this.camera.zoom - this.camera.y * this.camera.zoom;
            const w = TILE_SIZE * this.camera.zoom;
            this.ctx.fillStyle = plot.mature ? '#b7e16b' : '#5c8a4f';
            this.ctx.fillRect(x + 6, y + 6, w - 12, w - 12);
            this.ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            this.ctx.strokeRect(x + 6, y + 6, w - 12, w - 12);
          }
        };

        Game.prototype.drawColonists = function (startX, endX, startY, endY) {
          for (const colonist of this.colonists) {
            if (colonist.x < startX || colonist.x >= endX || colonist.y < startY || colonist.y >= endY) continue;
            const x = colonist.x * TILE_SIZE * this.camera.zoom - this.camera.x * this.camera.zoom;
            const y = colonist.y * TILE_SIZE * this.camera.zoom - this.camera.y * this.camera.zoom;
            const centerX = x + TILE_SIZE * this.camera.zoom * 0.5;
            const centerY = y + TILE_SIZE * this.camera.zoom * 0.5;
            const radius = TILE_SIZE * this.camera.zoom * 0.24;

            this.ctx.fillStyle = this.selectedColonistId === colonist.id ? '#75e5be' : colonist.tint;
            this.ctx.beginPath();
            this.ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            this.ctx.fill();

            this.ctx.fillStyle = '#1d2a34';
            this.ctx.fillRect(centerX - 2.5, centerY + radius + 4, 5, 8);
            this.ctx.fillStyle = '#0f1a22';
            this.ctx.fillRect(centerX - 10, centerY + 2, 20, 4);
          }
        };

        Game.prototype.getSelectedColonist = function () {
          if (!this.selectedColonistId) return null;
          return this.colonists.find((colonist) => colonist.id === this.selectedColonistId) || null;
        };

        Game.prototype.renderUI = function () {
          this.resourceBar.innerHTML = Object.entries(this.resources).map(([key, value]) => {
            return `<div class="resource-pill">${key}: ${Math.floor(value)}</div>`;
          }).join('');

          this.colonistList.innerHTML = this.colonists.map((colonist) => {
            return `<div class="colonist-item ${this.selectedColonistId === colonist.id ? 'selected' : ''}" data-id="${colonist.id}"><span class="avatar">${colonist.name.charAt(0)}</span><div><div>${colonist.name}</div><small>${colonist.task || colonist.job}</small></div></div>`;
          }).join('');

          this.colonistList.querySelectorAll('.colonist-item').forEach((item) => {
            item.addEventListener('click', () => {
              this.selectedColonistId = item.dataset.id;
              this.renderUI();
            });
          });

          const selected = this.getSelectedColonist();
          if (selected) {
            const priorityButtons = PRIORITY_NAMES.map((name, index) => {
              const value = ['low', 'normal', 'high', 'urgent'][index];
              return `<button class="priority-btn ${selected.priority === value ? 'active' : ''}" data-priority="${value}">${name}</button>`;
            }).join('');

            const taskButtons = [
              'gatherWood', 'gatherStone', 'farm', 'rest', 'eat', 'clear'
            ].map((task) => `<button class="task-btn" data-task="${task}">${TASKS[task]}</button>`).join('');

            this.selectedUnit.innerHTML = `
              <div class="status-line"><span>Name</span><strong>${selected.name}</strong></div>
              <div class="status-line"><span>Hunger</span><strong>${Math.round(selected.hunger)}%</strong></div>
              <div class="status-line"><span>Sleep</span><strong>${Math.round(selected.sleep)}%</strong></div>
              <div class="status-line"><span>Fun</span><strong>${Math.round(selected.fun)}%</strong></div>
              <div class="status-line"><span>Mood</span><strong>${Math.round(selected.mood)}%</strong></div>
              <div class="status-line"><span>Job</span><strong>${selected.task || selected.job}</strong></div>
              <div class="status-line"><span>Priority</span><strong>${selected.priority}</strong></div>
              <div class="priority-grid">${priorityButtons}</div>
              <div class="task-grid" style="margin-top:10px;">${taskButtons}</div>
            `;

            this.selectedUnit.querySelectorAll('.priority-btn').forEach((button) => {
              button.addEventListener('click', () => {
                this.setPriorityForSelected(button.dataset.priority);
              });
            });

            this.selectedUnit.querySelectorAll('.task-btn').forEach((button) => {
              button.addEventListener('click', () => {
                const task = button.dataset.task;
                if (task === 'clear') {
                  selected.task = null;
                  selected.job = 'wander';
                  this.renderUI();
                  return;
                }
                this.assignTask(task, selected.priority);
              });
            });
          } else {
            this.selectedUnit.innerHTML = `
              <div class="status-line"><span>Selection</span><strong>None</strong></div>
              <div class="status-line"><span>Tip</span><strong>Click a colonist</strong></div>
            `;
          }

          this.colonySummary.innerHTML = `
            <div class="status-line"><span>Colonists</span><strong>${this.colonists.length}</strong></div>
            <div class="status-line"><span>Food</span><strong>${Math.floor(this.resources.food)}</strong></div>
            <div class="status-line"><span>Wood</span><strong>${Math.floor(this.resources.wood)}</strong></div>
            <div class="status-line"><span>Stone</span><strong>${Math.floor(this.resources.stone)}</strong></div>
            <div class="status-line"><span>Build</span><strong>${this.buildMode ? BUILDINGS[this.buildMode].label : 'Off'}</strong></div>
          `;

          this.alertsBox.innerHTML = this.alerts.map((alert) => `<div class="alert-item">${alert}</div>`).join('');
          this.eventLog.innerHTML = this.log.slice(0, 8).map((entry) => `<div class="log-entry">${entry}</div>`).join('');
          this.timeLabel.textContent = `Day ${this.day}`;
          this.buildToggleBtn.textContent = this.buildMode ? 'Build: On' : 'Build';
        };

        Game.prototype.setPriorityForSelected = function (priority) {
          const colonist = this.getSelectedColonist();
          if (!colonist) return;
          colonist.priority = priority;
          this.log.unshift(`${colonist.name} priority set to ${priority}.`);
          this.renderUI();
        };

        Game.prototype.assignTask = function (task, priorityOverride) {
          const colonist = this.getSelectedColonist();
          if (!colonist) return;
          colonist.task = task;
          colonist.priority = priorityOverride || colonist.priority || 'normal';
          colonist.job = TASKS[task] || task;
          this.log.unshift(`${colonist.name} assigned to ${TASKS[task] || task}.`);
          this.renderUI();
        };

        Game.prototype.saveGame = function (silent = false) {
          const saveState = {
            world: {
              tiles: Array.from(this.world.tiles.entries()),
              resourceNodes: this.world.resourceNodes,
              structures: this.world.structures,
              cropPlots: this.world.cropPlots
            },
            colonists: this.colonists,
            resources: this.resources,
            camera: this.camera,
            selectedColonistId: this.selectedColonistId,
            time: this.time,
            day: this.day,
            log: this.log,
            alerts: this.alerts,
            buildMode: this.buildMode
          };
          localStorage.setItem(SAVE_KEY, JSON.stringify(saveState));
          if (!silent) this.showToast('Game saved');
        };

        Game.prototype.loadGame = function () {
          const raw = localStorage.getItem(SAVE_KEY);
          if (!raw) {
            this.showToast('No save found');
            return;
          }
          try {
            const saveState = JSON.parse(raw);
            this.world = createWorld(1);
            this.world.tiles = new Map(saveState.world.tiles || []);
            this.world.resourceNodes = saveState.world.resourceNodes || [];
            this.world.structures = saveState.world.structures || [];
            this.world.cropPlots = saveState.world.cropPlots || [];
            this.colonists = saveState.colonists || [];
            this.resources = saveState.resources || { ...DEFAULT_RESOURCES };
            this.camera = saveState.camera || { x: 0, y: 0, zoom: 1 };
            this.selectedColonistId = saveState.selectedColonistId || (this.colonists[0] ? this.colonists[0].id : null);
            this.time = saveState.time || 0;
            this.day = saveState.day || 1;
            this.log = saveState.log || ['Save loaded.'];
            this.alerts = saveState.alerts || ['The colony remains alive.'];
            this.buildMode = saveState.buildMode || null;
            this.refreshBuildButtons();
            this.showToast('Game loaded');
            this.renderUI();
          } catch (error) {
            this.showToast('Save failed');
          }
        };

        Game.prototype.newWorld = function () {
          this.world = createWorld(Math.random() * 1000);
          this.colonists = [];
          this.resources = { ...DEFAULT_RESOURCES };
          this.camera = { x: 0, y: 0, zoom: 1 };
          this.time = 0;
          this.day = 1;
          this.log = ['A new world begins.'];
          this.alerts = ['A fresh colony is underway.'];
          this.buildMode = null;
          this.spawnColonists();
          this.camera.x = 17 * TILE_SIZE;
          this.camera.y = 17 * TILE_SIZE;
          this.refreshBuildButtons();
          this.renderUI();
          this.showToast('New world created');
        };

        new Game();
      })();
    </script>
  </body>
</html>
